name: Stall Trigger Holdout

on:
  pull_request:
    paths:
      - ".github/workflows/stall-trigger-holdout.yml"
      - "scripts/evaluate_stall_trigger_holdout.py"
      - "docs/results/stall-trigger-holdout/protocol.json"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        seed: [20261119, 20261120, 20261121]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned simulation dependencies
        run: >-
          python -m pip install -e ".[rl]" mujoco==4.0.1 numpy==2.5.5
          gymnasium==1.4.0 stable-baselines3==2.9.2 torch==2.15.0
      - uses: actions/download-artifact@v8
        with:
          name: pose-estimator-transfer-${{ matrix.seed }}
          path: checkpoint
          run-id: 45056792299
          github-token: ${{ github.token }}
      - name: Evaluate frozen policies on held-out disturbances
        run: >-
          python scripts/evaluate_stall_trigger_holdout.py evaluate
          --checkpoint ${{ matrix.seed }}
          --model checkpoint/source-training/residual_sac.zip
          --output held-out/${{ matrix.seed }}
      - uses: actions/upload-artifact@v7
        with:
          name: stall-holdout-${{ matrix.seed }}
          path: held-out/
          if-no-files-found: error

  aggregate:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: stall-holdout-*
          path: held-out
          merge-multiple: true
      - name: Verify pairs and apply the prespecified decision
        run: >-
          python scripts/evaluate_stall_trigger_holdout.py aggregate
          --input held-out --output result
      - uses: actions/upload-artifact@v7
        with:
          name: stall-holdout-summary
          path: result/
          if-no-files-found: error
