name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run tests
        run: python -m pytest

  experiments:
    needs: quality
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Install software rendering runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes libosmesa6-dev

      - name: Run reproducible experiments
        run: |
          python -m panda_assembly joint --output showcase-results/joint
          python -m panda_assembly cartesian --output showcase-results/cartesian
          python -m panda_assembly peg --output showcase-results/peg
          python -m panda_assembly batch --output showcase-results/robustness
          python -m panda_assembly joint \
            --config configs/menagerie.toml \
            --output showcase-results/menagerie-joint
          python -m panda_assembly cartesian \
            --config configs/menagerie.toml \
            --output showcase-results/menagerie-cartesian
          python -m panda_assembly peg \
            --config configs/menagerie.toml \
            --output showcase-results/menagerie-peg
          python -m panda_assembly compare \
            --config configs/menagerie.toml \
            --output showcase-results/controller-comparison
          python -m panda_assembly compare-batch \
            --config configs/menagerie.toml \
            --output showcase-results/controller-robustness
          python -m panda_assembly monte-carlo \
            --config configs/menagerie.toml \
            --output showcase-results/monte-carlo
          python -m panda_assembly boundary-scan \
            --config configs/menagerie.toml \
            --output showcase-results/boundary-scan
          python -m panda_assembly boundary-refine \
            --config configs/menagerie.toml \
            --output showcase-results/boundary-refinement
          python -m panda_assembly safety-recovery \
            --config configs/menagerie.toml \
            --output showcase-results/safety-recovery
          python -m panda_assembly contact-recovery \
            --config configs/menagerie.toml \
            --output showcase-results/contact-recovery
          python -m panda_assembly predictive-impact \
            --config configs/menagerie.toml \
            --output showcase-results/predictive-impact

      - name: Render verified final scene
        env:
          MUJOCO_GL: osmesa
        run: |
          python scripts/render_showcase.py \
            --timeseries showcase-results/peg/timeseries.csv \
            --output showcase-results/scene.png \
            --animation-output showcase-results/insertion.gif
          python scripts/render_showcase.py \
            --model-variant menagerie \
            --timeseries showcase-results/menagerie-peg/timeseries.csv \
            --output showcase-results/menagerie-scene.png

      - name: Upload experiment results
        uses: actions/upload-artifact@v7
        with:
          name: showcase-results
          path: showcase-results/
          if-no-files-found: error
          retention-days: 30

      - name: Validate contact recovery acceptance
        run: >-
          python scripts/validate_contact_recovery.py
          showcase-results/contact-recovery/contact_recovery_summary.json

