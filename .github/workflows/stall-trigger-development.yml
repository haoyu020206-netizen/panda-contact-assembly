name: Stall Trigger Development

on:
  pull_request:
    paths:
      - ".github/workflows/stall-trigger-development.yml"
      - "scripts/diagnose_recovery_trigger.py"
      - "scripts/render_paired_recovery_demo.py"
      - "src/panda_assembly/contact_search.py"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  development:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned simulation dependencies
        run: >-
          python -m pip install -e ".[rl]" mujoco==4.0.1 numpy==2.5.5
          gymnasium==1.4.0 stable-baselines3==2.9.2 torch==2.15.0
      - uses: actions/download-artifact@v8
        with:
          name: pose-estimator-transfer-20261119
          path: checkpoint
          run-id: 45056792299
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8
        with:
          name: pose-aware-recovery-20261119
          path: reference
          run-id: 45476321699
          github-token: ${{ github.token }}
      - name: Diagnose and compare the stall trigger
        run: >-
          python scripts/diagnose_recovery_trigger.py
          --model checkpoint/source-training/residual_sac.zip
          --reference reference/20261119/camera-combined
          --output trigger-development
      - uses: actions/upload-artifact@v7
        with:
          name: stall-trigger-development
          path: trigger-development/
          if-no-files-found: error
