name: Residual RL Training

on:
  pull_request:
    paths:
      - ".github/workflows/residual-rl.yml"
      - "configs/*.toml"
      - "pyproject.toml"
      - "scripts/train_residual_sac.py"
      - "src/panda_assembly/residual_rl.py"
      - "tests/test_residual_rl.py"
  workflow_dispatch:
    inputs:
      timesteps:
        description: SAC environment steps
        required: true
        default: "50000"
        type: string
      evaluation_episodes:
        description: Paired evaluation episodes per policy
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install residual RL dependencies
        run: python -m pip install -e ".[rl]"

      - name: Train and evaluate SAC residual
        run: >-
          python scripts/train_residual_sac.py
          --config configs/mvp.toml
          --output residual-rl-results
          --timesteps "${{ inputs.timesteps || '500' }}"
          --evaluation-episodes "${{ inputs.evaluation_episodes || '2' }}"
          --bc-episodes "${{ inputs.evaluation_episodes || '2' }}"
          --bc-epochs 20

      - name: Upload policy and evaluation
        uses: actions/upload-artifact@v7
        with:
          name: residual-rl-results
          path: residual-rl-results/
          if-no-files-found: error
          retention-days: 30
