name: Residual RL Multi-Seed Ablation

on:
  workflow_dispatch:
    inputs:
      timesteps:
        description: SAC environment steps per run
        required: true
        default: "10000"
        type: string
      evaluation_episodes:
        description: Paired evaluation episodes per policy and run
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [20261119, 20261120, 20261121]
        rehearsal: [none, teacher]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MPLBACKEND: Agg
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install residual RL dependencies
        run: python -m pip install -e ".[rl]"

      - name: Train seeded ablation
        run: >-
          python scripts/train_residual_sac.py
          --config configs/mvp.toml
          --output ablation-result
          --timesteps "${{ inputs.timesteps }}"
          --evaluation-episodes "${{ inputs.evaluation_episodes }}"
          --bc-episodes "${{ inputs.evaluation_episodes }}"
          --bc-epochs 20
          --seed "${{ matrix.seed }}"
          --rehearsal-mode "${{ matrix.rehearsal }}"

      - name: Upload seeded result
        uses: actions/upload-artifact@v7
        with:
          name: residual-ablation-${{ matrix.rehearsal }}-${{ matrix.seed }}
          path: ablation-result/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install plotting dependencies
        run: python -m pip install -e ".[plot]"

      - name: Download seeded results
        uses: actions/download-artifact@v8
        with:
          pattern: residual-ablation-*
          path: downloaded-results

      - name: Aggregate ablation
        run: >-
          python scripts/aggregate_residual_ablation.py
          downloaded-results
          --output residual-ablation-summary

      - name: Upload ablation summary
        uses: actions/upload-artifact@v7
        with:
          name: residual-ablation-summary
          path: residual-ablation-summary/
          if-no-files-found: error
          retention-days: 30
