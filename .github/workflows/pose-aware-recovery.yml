name: Pose-Aware Recovery

on:
  pull_request:
    paths:
      - ".github/workflows/pose-aware-recovery.yml"
      - "scripts/compare_pose_recovery.py"
      - "scripts/evaluate_pose_estimator_transfer.py"
      - "src/panda_assembly/contact_search.py"
      - "src/panda_assembly/residual_rl.py"
  workflow_dispatch:
    inputs:
      checkpoint_run:
        description: Run ID containing the three seeded pose-estimator checkpoints
        default: "45056792299"
        type: string

permissions:
  actions: read
  contents: read

jobs:
  evaluate:
    strategy:
      fail-fast: false
      matrix:
        seed: [20261119, 20261120, 20261121]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark dependencies
        run: >-
          python -m pip install -e ".[rl]" mujoco==4.0.1 numpy==2.5.5
          gymnasium==1.4.0 stable-baselines3==2.9.2 torch==2.15.0
      - name: Download original checkpoint
        uses: actions/download-artifact@v8
        with:
          name: pose-estimator-transfer-${{ matrix.seed }}
          path: checkpoint-artifact
          run-id: ${{ inputs.checkpoint_run || '45056792299' }}
          github-token: ${{ github.token }}
      - name: Evaluate four recovery variants
        env:
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: >-
          python scripts/evaluate_pose_estimator_transfer.py
          --model checkpoint-artifact/source-training/residual_sac.zip
          --output recovery-results/${{ matrix.seed }}
          --seed "${{ matrix.seed }}" --episodes 20 --compare-recovery
      - uses: actions/upload-artifact@v7
        with:
          name: pose-aware-recovery-${{ matrix.seed }}
          path: recovery-results/
          if-no-files-found: error

  compare:
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: pose-aware-recovery-*
          path: downloaded-results
          merge-multiple: true
      - name: Compare paired episode outcomes
        run: >-
          python scripts/compare_pose_recovery.py downloaded-results
          --output recovery-comparison.json
      - uses: actions/upload-artifact@v7
        with:
          name: pose-aware-recovery-comparison
          path: recovery-comparison.json
          if-no-files-found: error
